services:
  zookeeper:
    image: bitnamilegacy/zookeeper:latest
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes

  kafka:
    image: bitnamilegacy/kafka:3.3.1
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_MESSAGE_MAX_BYTES=67108864
      - KAFKA_CFG_REPLICA_FETCH_MAX_BYTES=67108864
      # Fast log-cleaner for smoke tests: check retention every second and
      # roll segments frequently so the log cleaner can actually delete them.
      - KAFKA_CFG_LOG_RETENTION_CHECK_INTERVAL_MS=1000
      - KAFKA_CFG_LOG_ROLL_MS=2000
      - KAFKA_CFG_LOG_SEGMENT_BYTES=10485760
